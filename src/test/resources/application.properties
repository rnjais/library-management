# ===================================================================
# Library Management System - Isolated Test Configuration
# Uses library_test_db to guarantee tests never touch production/dev data
# ===================================================================
spring.application.name=library-management

# -------------------------------------------------------------------
# Isolated Test Database (MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_TEST_NAME:library_test_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Aryan@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Disable Real Outbound Mail Calls in Tests
# -------------------------------------------------------------------
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025

# -------------------------------------------------------------------
# Domain Properties for Tests
# -------------------------------------------------------------------
app.fine.daily-rate=5.00
app.fine.currency=INR
app.jwt.secret-key=dGhpcy1pcy1hLXNhZmUtZGV2ZWxvcG1lbnQtdGVzdC1qd3Qtc2VjcmV0LWtleS0yNTYtYml0cw==
app.jwt.expiration-ms=86400000
app.borrowing.overdue-cron=0 0 0 * * ?
app.mail.from=test@library.com
app.mail.sender-name=Test Library
app.reminders.days-before-due=2
app.reminders.cron=0 0 8 * * ?
