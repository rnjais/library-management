# ===================================================================
# Library Management System - Application Configuration
# ===================================================================

# -------------------------------------------------------------------
# Application General
# -------------------------------------------------------------------
spring.application.name=library-management

# -------------------------------------------------------------------
# MySQL Database Datasource Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aryan@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Spring Mail / SMTP Configuration
# Credentials and host are externalized via environment variables
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -------------------------------------------------------------------
# SQL Logging Levels
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# -------------------------------------------------------------------
# Fine Management Properties
# -------------------------------------------------------------------
app.fine.daily-rate=${FINE_DAILY_RATE:5.00}
app.fine.currency=${FINE_CURRENCY:INR}

# -------------------------------------------------------------------
# JWT Security Properties
# -------------------------------------------------------------------
app.jwt.secret-key=${JWT_SECRET_KEY:dGhpcy1pcy1hLXNhZmUtZGV2ZWxvcG1lbnQtdGVzdC1qd3Qtc2VjcmV0LWtleS0yNTYtYml0cw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Borrowing Synchronization Scheduler Properties
# -------------------------------------------------------------------
app.borrowing.overdue-cron=${BORROWING_OVERDUE_CRON:0 0 0 * * ?}

# -------------------------------------------------------------------
# Email Dispatching Properties
# -------------------------------------------------------------------
app.mail.from=${APP_MAIL_FROM:noreply@librarymanagement.com}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:Library Management System}
app.mail.enabled=${APP_MAIL_ENABLED:true}

# -------------------------------------------------------------------
# Due-Date Reminder Scheduler Properties
# -------------------------------------------------------------------
app.reminders.days-before-due=${REMINDERS_DAYS_BEFORE_DUE:2}
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * ?}

# -------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI Properties
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
