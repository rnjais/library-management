# ==============================================================================
# Library Management System - Production Configuration Profile (prod)
# Activate using: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# ------------------------------------------------------------------------------
# Application Identity
# ------------------------------------------------------------------------------
spring.application.name=library-management

# ------------------------------------------------------------------------------
# Production MySQL Datasource Configuration
# All credentials and network hosts MUST be supplied via environment variables
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_management_db}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# HikariCP Production Connection Pool Optimization
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=LibraryHikariProdPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.leak-detection-threshold=15000

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Production Settings
# In production, Hibernate validates the schema and NEVER drops or mutates tables
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ------------------------------------------------------------------------------
# Production Error Response Masking (OWASP Security Compliance)
# Prevents leaking stack traces, internal paths, or framework exceptions
# ------------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ------------------------------------------------------------------------------
# Production Logging (Quiet, High Performance)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.library_management=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Production Log File Rotation
logging.file.name=${LOG_FILE:logs/library-prod.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ------------------------------------------------------------------------------
# JWT Security Properties
# Must be supplied via environment variable in production
# ------------------------------------------------------------------------------
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Spring Mail / SMTP Production Settings
# ------------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:noreply@librarymanagement.com}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:Library Management System}
app.mail.enabled=${APP_MAIL_ENABLED:true}

# ------------------------------------------------------------------------------
# Fine Management & Overdue Schedulers
# ------------------------------------------------------------------------------
app.fine.daily-rate=${FINE_DAILY_RATE:5.00}
app.fine.currency=${FINE_CURRENCY:INR}
app.borrowing.overdue-cron=${BORROWING_OVERDUE_CRON:0 0 0 * * ?}
app.reminders.days-before-due=${REMINDERS_DAYS_BEFORE_DUE:2}
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * ?}

# ------------------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
